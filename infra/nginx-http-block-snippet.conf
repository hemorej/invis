# NOT included automatically — this belongs in the global http{} context
# (Forge dashboard → Server → Files → "Nginx Configuration", which edits
# /etc/nginx/nginx.conf), not in a per-site vhost file. Paste this inside
# the existing http{} block, then `nginx -t && sudo service nginx reload`.
#
# Replaces the three sequential `if ($http_user_agent ...)` checks in
# kirby.nginx.conf / kirby.com.nginx.conf with a single O(1) map lookup
# evaluated once per request instead of three regex tests in series.

map $http_user_agent $blocked_agent {
    default 0;
    "" 1;
    "~*(zgrab|masscan|l9scan|l9tcpid|leakix|CVE-|CyberConvoy|RecordedFuture|Go-http-client|fasthttp|python-requests|Scrapy|CensysInspect|InternetMeasurement)" 1;
}
