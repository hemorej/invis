# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3311015/before/*;
include forge-conf/3311015/the-invisible-cities.com/before/*;

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name the-invisible-cities.com;
    server_tokens off;
    root /home/forge/the-invisible-cities.com/current;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Serve ACME challenge files as static content before any routing or redirects.
    # ^~ stops nginx checking regex locations, so Kirby's PHP routing never sees these.
    # Forge places challenge files under the webroot during cert renewal.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        alias /home/forge/.letsencrypt/;
    }

    # AI / data-mining crawler block, independent of robots.txt compliance.
    # Keep in sync with the AI-bot section of robots.txt
    # (source list: https://github.com/ai-robots-txt/ai.robots.txt)
    if ($http_user_agent ~* "(AddSearchBot|AgentTimes|AhrefsBot|AI2Bot|AI2Bot\-DeepResearchEval|Ai2Bot\-Dolma|aiHitBot|AIWebIndex|amazon\-kendra|amazon\-QBusiness|Amazonbot|AmazonBuyForMe|Amzn\-SearchBot|Amzn\-User|Andibot|Anomura|anthropic\-ai|AnthropicBot|ApifyBot|ApifyWebsiteContentCrawler|Applebot|Applebot\-Extended|Aranet\-SearchBot|atlassian\-bot|Awario|AzureAI\-SearchBot|bedrockbot|bigsur\.ai|Bravebot|Brightbot|Brightbot\ 1\.0|BuddyBot|Bytespider|CCBot|Channel3Bot|ChatGLM\-Spider|ChatGPT\ Agent|ChatGPT\-User|Claude\-SearchBot|Claude\-User|Claude\-Web|ClaudeBot|Cloudflare\-AutoRAG|CloudVertexBot|cohere\-ai|cohere\-training\-data\-crawler|Cotoyogi|CragCrawler|Crawl4AI|Crawlspace|Datenbank\ Crawler|DeepSeekBot|Diffbot|Diffbot\-User|DoubaoBot|DuckAssistBot|Echobot\ Bot|EchoboxBot|ERNIEBot|ExaBot|ExaSearchBot|facebookexternalhit|Factset_spyderbot|FirecrawlAgent|FriendlyCrawler|GeistHaus\-PageFetcher|Gemini\-Deep\-Research|Google\-Agent|Google\-CloudVertexBot|Google\-Extended|Google\-Firebase|Google\-Gemini\-CLI|Google\-NotebookLM|GoogleAgent\-Mariner|GoogleAgent\-URLContext|GoogleOther|GoogleOther\-Image|GoogleOther\-Video|GPTBot|HenkBot|iAskBot|iaskspider|iaskspider/2\.0|ICC\-Crawler|ImagesiftBot|imageSpider|img2dataset|ISSCyberRiskCrawler|kagi\-fetcher|Kangaroo\ Bot|Kimi\-SearchBot|Kimi\-User|KimiBot|KlaviyoAIBot|KunatoCrawler|laion\-huggingface\-processor|LAIONDownloader|LCC|LinerBot|Linguee\ Bot|LinkupBot|Manus\-User|Meta\-ExternalAgent|meta\-externalfetcher|meta\-webindexer|MistralAI\-Index|MistralAI\-Training|MistralAI\-User|MistralAI\-User/1\.0|MJ12bot|MyCentralAIScraperBot|NagetBot|netEstate\ Imprint\ Crawler|newsai|NotebookLM|NovaAct|OAI\-AdsBot|OAI\-SearchBot|omgili|omgilibot|OpenAI|PanguBot|Panscient|panscient\.com|Perplexity\-User|PerplexityBot|PetalBot|PhindBot|Poggio\-Citations|Poseidon\ Research\ Crawler|QualifiedBot|Querit\-SearchBot|QueritBot|QuillBot|quillbot\.com|QwenBot|Reflectionbot|SBIntuitionsBot|SemrushBot|SemrushBot\-OCOB|SemrushBot\-SWA|Shap\-User|ShapBot|Sidetrade\ indexer\ bot|TavilyBot|Terra\ Cotta|TerraCotta|Thinkbot|TikTokSpider|Timpibot|TongyiBot|TwinAgent|UseAI|VelenPublicWebCrawler|WARDBot|Webzio\-Extended|wpbot|WRTNBot|YaK|YandexAdditional|YandexAdditionalBot|YiyanBot|YouBot|ZanistaBot)") {
        return 403;
    }

    # TDM (text & data mining) opt-out signal, per the EU Copyright Directive art. 4 reservation standard
    add_header Tdm-Reservation "1" always;

    # --- Bot / scanner mitigation ---
    # Shared rules (scanner UA blocklist, WP/Joomla/IoT/admin probes, dotfile
    # drop, backup/source-extension block) — canonical source:
    # ~/Code/util/infra/nginx/snippets/bot-mitigation.conf (the $blocked_agent
    # map it uses is in the shared conf.d/user-agent-blocklist.conf)
    include snippets/bot-mitigation.conf;

    # To enable rate limiting for this app, uncomment (zone already declared
    # in /etc/nginx/conf.d/rate-limits.conf):
    # limit_req zone=invis_api burst=40 nodelay;
    # limit_req_status 429;
    # --- End bot / scanner mitigation ---

    # Don't hint these as folders
    rewrite ^/(content|site|kirby)$ /error last;

    # Block content
    rewrite ^/content/(.*).(txt|md|mdown)$ /error last;

    # Block all files in the site and kirby folder from being accessed directly
    rewrite ^/(site|kirby)/(.*)$ /error last;
    
    location ^~ /media/ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Tdm-Reservation "1" always;
        add_header X-Robots-Tag "noai, noimageai" always;
        access_log off;
    }

    # Serve built/static assets directly, bypassing PHP, with long-lived caching
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Tdm-Reservation "1" always;
        access_log off;
    }

    # Images served outside /media/ (favicons, static site assets, etc.)
    location ~* \.(?:svg|jpe?g|png|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Tdm-Reservation "1" always;
        add_header X-Robots-Tag "noai, noimageai" always;
        access_log off;
    }

    # Site links
    location / {
        autoindex off;
        try_files $uri $uri/ /index.php?$query_string; #$uri&$args;
    }

    # PHP scripts
    location ~ \.php$ {
        add_header Tdm-Reservation "1" always;

        # Set CORS headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
          add_header 'Access-Control-Allow-Origin' '*';
          add_header 'Access-Control-Allow-Credentials' 'true';
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
          add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }
        if ($request_method = 'GET') {
          add_header 'Access-Control-Allow-Origin' '*';
          add_header 'Access-Control-Allow-Credentials' 'true';
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
          add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_script_name;
        include fastcgi_params;
    }

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/domains/1860889/3647249/server.crt;
    ssl_certificate_key /etc/nginx/ssl/domains/1860889/3647249/server.key;

    include forge-conf/3311015/site.conf;
}

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3311015/after/*;
include forge-conf/3311015/the-invisible-cities.com/after/*;