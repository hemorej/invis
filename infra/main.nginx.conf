ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

# Avoid a full TLS handshake on repeat visits
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";

index index.html index.htm index.php;

charset utf-8;

# Compression for text-based responses and built assets
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml font/woff2;

# Cache file metadata to cut stat() calls for the flat-file content tree and static assets
open_file_cache max=2000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3264932/server/*;

# location / {
#    try_files $uri $uri/ /index.php?$query_string;
# }

location = /favicon.ico { access_log off; log_not_found off; }
location = /favicon.svg { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

access_log off;
error_log  /var/log/nginx/3264932-error.log error;

error_page 404 /index.php;

# NOTE: the \.php$ location lives in kirby.nginx.conf / kirby.com.nginx.conf
# (per-vhost, includes CORS headers + fastcgi_split_path_info). It was
# previously duplicated here, which nginx rejects as a "duplicate location"
# config error since this file is included inside the same server{} block.

location ~ /\.(?!well-known).* {
    return 444;
}