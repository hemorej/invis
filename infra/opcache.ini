# Confirmed already live on production (2026-07-03) via the FPM pool's
# actual php.ini (/etc/php/8.5/fpm/php.ini) — checked with
# `php-fpm8.5 -m | grep -i opcache` and `grep -i opcache /etc/php/8.5/fpm/php.ini`,
# NOT `php -i` from a CLI shell, which reads a separate ini file and is
# misleading here (opcache.enable_cli=0 there is expected and unrelated to
# whether FPM has it on).
#
# Production already meets or exceeds every value below:
#   opcache.enable              = 1      (matches)
#   opcache.validate_timestamps = 0      (matches — the directive that matters
#                                          most for a flat-file CMS with no DB
#                                          to hide the per-request stat() cost
#                                          behind)
#   opcache.memory_consumption      = 512  (server; this file suggested 192)
#   opcache.max_accelerated_files   = 30000 (server; this file suggested 20000)
#   opcache.interned_strings_buffer = 64   (server; this file suggested 16)
#
# Kept as a reference/floor for provisioning a new server or restoring this
# config after an OS/PHP upgrade wipes php.ini — not an outstanding change.
# validate_timestamps=0 is only safe because infra/forge_deploy.sh reloads
# php-fpm on every release, which clears the opcache and picks up new code.

opcache.enable=1
opcache.enable_cli=0

opcache.max_accelerated_files=20000
opcache.memory_consumption=192
opcache.interned_strings_buffer=16

opcache.validate_timestamps=0
opcache.revalidate_freq=0
