# NOT included automatically — this is a PHP config file, not part of this
# repo's deploy. Paste these into the server's php.ini (Forge dashboard →
# Server → PHP → "PHP Config File", or /etc/php/8.5/fpm/conf.d/10-opcache.ini),
# then `sudo service php8.5-fpm reload`.
#
# Kirby is a flat-file CMS with no database to absorb request cost, so every
# uncached PHP file (kirby/ core + site/plugins/*/vendor + templates) gets
# re-parsed from source on every request unless opcache is tuned for
# production. These settings assume infra/forge_deploy.sh's existing
# `sudo service php8.5-fpm reload` step, which restarts FPM workers and
# clears their opcache — required because validate_timestamps=0 below stops
# opcache from noticing file changes on its own.

opcache.enable=1
opcache.enable_cli=0

; Kirby core + all plugin vendor/ directories add up to several thousand
; PHP files. Default 128 is too small and causes cache churn (files get
; evicted and re-compiled). 2000 comfortably covers this codebase with
; headroom for content growth.
opcache.max_accelerated_files=20000
opcache.memory_consumption=192
opcache.interned_strings_buffer=16

; Skip the mtime check on every request. Safe because the only deploy path
; is forge_deploy.sh, which reloads php-fpm (clearing the cache) after
; every release — there is no scenario where a file changes underneath a
; running worker.
opcache.validate_timestamps=0

; Not needed once validate_timestamps=0, but harmless if it's ever
; re-enabled for a debugging session.
opcache.revalidate_freq=0
