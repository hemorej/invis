title: Newsletter Edition
preset: page
pages: false
fields:
  title:
    label: Title
    type: text
    required: true
  published:
    label: Published
    type: date
    default: today
    required: true
  thumbnail:
    label: Thumbnail
    type: files
    query: page.images
    layout: cards
    multiple: false
    store: id
    help: Preview image shown in the newsletter archive list
  text:
    label: Content
    type: textarea
    size: large
    buttons: false
