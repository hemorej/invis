title: Prints
icon: cart
tabs:
  products:
    label: Products
    columns:
      - width: 1/3
        fields:
          hidden:
            type: pagelist
            label: Hidden
            status: unlisted
            blueprints:
              - product
              - article
      - width: 1/3
        fields:
          drafts:
            type: pagelist
            label: Drafts
            status: draft
            create: 
              - product
              - article
      - width: 1/3
        fields:
          listed:
            type: pagelist
            label: Published
            status: listed

  regions:
    label: Shipping regions
    fields:
      regions:
        extends: fields/regions
        label: Shipping regions

  shipping:
    label: Shipping profiles
    fields:
      shipping:
        extends: fields/shipping
        label: Shipping profiles

  orders: 
    label: Orders
    columns:
      - width: 1/3
        fields:
          shipped:
            label: Shipped orders
            type: pagelist
            blueprint: order
            create: false
            query: site.find('orders').drafts.filterBy('orderstatus', '==', 'shipped')
            sortBy: shipping_date desc

      - width: 1/3
        fields:
          paid:
            type: pagelist
            label: Completed orders
            blueprint: order
            create: false
            query: site.find('orders').drafts.filterBy('orderstatus', '==', 'paid')                                     
            sortBy: txn_date desc

      - width: 1/3
        fields:
          unshipped:
            type: pagelist
            label: Other orders
            blueprint: order
            create: false
            query: site.find('orders').drafts.filterBy('orderstatus', 'in', ['pending', 'canceled', 'returned'])        
            sortBy: txn_date desc
