# laravel-mix reaches into webpack's internals directly (require('webpack/lib/...'))
# instead of declaring webpack as a proper dependency, which only resolves under a
# flat/hoisted node_modules tree. pnpm's default strict isolation breaks that lookup,
# so hoist everything to the root, matching npm/yarn-classic layout. (pnpm 11 moved
# this setting out of .npmrc and into pnpm-workspace.yaml.)
shamefullyHoist: true
